# Builds the Windows installer and attaches it to a draft GitHub Release.
# Trigger: push a tag matching the app version, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: MacRO Maker v__VERSION__
          releaseBody: |
            Download the **`_x64-setup.exe`** file below and run it.

            Windows may show "Windows protected your PC" because the installer isn't code-signed.
            Click **More info → Run anyway**.
          releaseDraft: true
          prerelease: false
